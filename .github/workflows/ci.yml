name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  health-check:
    name: Repository health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install health check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-pil python3-fonttools
      # Same gate scripts/release.sh enforces: required files, light/dark
      # parity, layout drift, metadata, bash -n and shellcheck.
      - name: verify-all.sh
        run: ./verify-all.sh
      - name: Audit unresolved source icon references
        run: |
          python3 scripts/icon-coverage.py > "$RUNNER_TEMP/icon-coverage-source.json"
          python3 - "$RUNNER_TEMP/icon-coverage-source.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("Icon coverage counts:", json.dumps(report["counts"], sort_keys=True))
          for status in ("not_in_theme", "native_mapping_not_verified"):
              rows = report["references"].get(status, [])
              print(f"{status}: {len(rows)}")
              for row in rows:
                  candidates = row.get("qml_candidates", [])
                  if candidates:
                      locations = ", ".join(
                          f"{item['file']}:{item['line']}" for item in candidates[:3]
                      )
                      print(f"  {row['name']}: {locations}")
          PY
      - name: Validate Qt Quick Start menu key handlers
        run: python3 scripts/check-startmenu-keys.py
      - name: KWin JavaScript regression tests
        run: |
          node tests/osd/test-placement.cjs
          node tests/shortcuts/test-snapkeys.cjs
      - name: NixOS installation and runtime identity tests
        run: |
          bash -n install-nixos.sh
          python3 -m unittest discover -s tests/nixos -v
      - name: Reversible application appearance tests
        run: python3 -m unittest discover -s tests/apps -v
      - name: Native resource reader tests
        run: /usr/bin/python3 -m unittest discover -s tests/native-assets -v
      - name: Window material tests
        run: /usr/bin/python3 -m unittest discover -s tests/theme -p test_window_materials.py -v
      - name: Microsoft Store icon tests
        run: /usr/bin/python3 -m unittest discover -s tests/theme -p test_store_icon.py -v
      - name: Verify both reviewed Microsoft Store SVGs
        run: |
          python3 scripts/store-artwork.py prepare "$RUNNER_TEMP/store-artwork"
          python3 scripts/store-artwork.py verify "$RUNNER_TEMP/store-artwork"
          cat "$RUNNER_TEMP/store-artwork/manifest.json"
      - name: Optional Plymouth boot artwork tests
        run: /usr/bin/python3 -m unittest discover -s tests/theme -p test_boot_frames.py -v
      - name: Private owner bundle rejection checks
        run: /usr/bin/python3 -m unittest discover -s tests/theme -p test_owner_bundle.py -v

  build-applets:
    name: Build C++ applets (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fedora releases track Plasma closely; bump when a new one ships.
        fedora: ["44", "45"]
    container: fedora:${{ matrix.fedora }}
    steps:
      # git first: without it actions/checkout downloads GitHub's tarball,
      # which honours .gitattributes export-ignore and so has no tests/.
      - name: Install git
        run: dnf install -y --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ cmake extra-cmake-modules findutils \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel \
            kf6-kpackage-devel kf6-kconfig-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kwindowsystem-devel kf6-kio-devel kf6-kiconthemes-devel \
            kf6-kitemmodels-devel kf6-kservice-devel kf6-kxmlgui-devel kf6-kglobalaccel-devel \
            kf6-kjobwidgets-devel kf6-kcmutils-devel kf6-knotifications-devel \
            plasma-activities-devel plasma-activities-stats-devel \
            libplasma-devel plasma-workspace-devel libksysguard-devel \
            kf6-kirigami python3 plasma-nm plasma-pa powerdevil bluedevil plasma-desktop \
            /usr/lib64/qt6/qml/org/kde/plasma/plasma5support/qmldir \
            /usr/lib64/qt6/qml/org/kde/notificationmanager/qmldir \
            /usr/lib64/qt6/qml/org/kde/milou/qmldir \
            /usr/lib64/qt6/qml/Qt5Compat/GraphicalEffects/qmldir
      - name: Parse every owned QML file
        run: bash scripts/check-qml-syntax.sh
      - name: Test task icon optical geometry
        run: |
          g++ -std=c++20 tests/panel/test_panelicon.cpp $(pkg-config --cflags --libs Qt6Gui) -o /tmp/wm-panelicon-test
          /tmp/wm-panelicon-test
      - name: Build and link-check native plugins
        run: ./scripts/ci-build.sh "$RUNNER_TEMP/build"
      - name: QML tests
        run: QT_QPA_PLATFORM=offscreen tests/run-qml-tests.sh
      - name: QML interaction tests at 150 percent output scaling
        run: QT_QPA_PLATFORM=offscreen QT_SCALE_FACTOR=1.5 tests/run-qml-tests.sh
      # Prebuilt plugins for installs without a compiler: keyed by distro,
      # Plasma and Qt version (scripts/install-lib.sh picks the match).
      - name: Package plugins
        run: ./scripts/package-plugins.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/plugins"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-fedora${{ matrix.fedora }}
          path: ${{ runner.temp }}/plugins/

  # Package the exact tested source and matching plugins for owner testing.
  # The archive remains a CI artifact; no stable version tag is created.
  integration-bundle:
    name: Package integration bundle
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [health-check, build-applets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download matching plugin builds
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: ${{ runner.temp }}/integration-plugins
      - name: Package exact commit
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-plugins"
          cat "$RUNNER_TEMP"/integration-plugins/*/SHA256SUMS > "$RUNNER_TEMP/bundle-plugins/SHA256SUMS"
          cp "$RUNNER_TEMP"/integration-plugins/*/*.tar.gz "$RUNNER_TEMP/bundle-plugins/"
          WM_BUNDLE_PLUGINS_DIR="$RUNNER_TEMP/bundle-plugins" ./scripts/package.sh --integration
          python3 scripts/verify-integration-bundle.py "$GITHUB_SHA" dist/KDE-Windows-Modern-*-integration-*.zip
          (cd dist && sha256sum KDE-Windows-Modern-*-integration-*.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Modern-integration-${{ github.sha }}
          path: |
            dist/KDE-Windows-Modern-*-integration-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # On a release tag, attach the prebuilt plugins (and one SHA256SUMS) to
  # the release that scripts/release.sh created.
  release-plugins:
    name: Attach prebuilt plugins to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-applets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: plugins
      - name: Merge checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cat plugins/*/SHA256SUMS > out/SHA256SUMS
          cp plugins/*/*.tar.gz out/
          # release.sh pushes the tag, then creates the release: wait for it.
          for _ in $(seq 30); do
            gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber --repo "${GITHUB_REPOSITORY}"

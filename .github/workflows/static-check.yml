name: Static Check

# An explicit request-file update is the manual entry point while this
# workflow lives only on testing. Ordinary source pushes do not start it.
on:
  workflow_dispatch:
  push:
    branches: [testing]
    paths: ['.github/static-check.request']

permissions:
  contents: read

concurrency:
  group: static-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source syntax and resource audit
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: dnf install -y --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the exact checked-out repository in this container
        id: checkout
        run: |
          # checkout sets safe.directory in its temporary HOME; subsequent
          # container steps use a different HOME. Trust only this workspace.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --short
      - name: Install static analysis dependencies
        id: deps
        if: steps.checkout.outcome == 'success'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            ShellCheck python3 nix-legacy qt6-qtdeclarative-devel \
            qt6-qtbase-devel libplasma-devel kf6-kirigami kwin \
            plasma-workspace plasma-desktop
          rpm -q ShellCheck nix-legacy qt6-qtdeclarative-devel kwin
      - name: Shell syntax and lint
        if: steps.deps.outcome == 'success' && !cancelled()
        run: |
          # A process substitution can hide a git ls-files failure from
          # Bash's errexit. Complete the inventory before starting checks.
          inventory="$(mktemp)"
          trap 'rm -f -- "$inventory"' EXIT
          git ls-files -z -- '*.sh' > "$inventory"
          mapfile -d '' -t scripts < "$inventory"
          [ "${#scripts[@]}" -gt 0 ]
          echo "Checking ${#scripts[@]} tracked Shell scripts"
          failed=0
          for file in "${scripts[@]}"; do
            bash -n "$file" || failed=1
          done
          shellcheck -x "${scripts[@]}" || failed=1
          exit "$failed"
      - name: JSON, XML and SVG parsing
        if: steps.deps.outcome == 'success' && !cancelled()
        run: |
          python3 - <<'PY'
          import gzip, json, pathlib, subprocess, xml.etree.ElementTree as ET
          patterns = ["*.json", "*.xml", "*.svg", "*.svgz", "*.kcfg", "*.ui",
                      "config/kxmlgui5/**/*.rc"]
          files = subprocess.check_output(["git", "ls-files", "-z", "--", *patterns])
          count = 0
          errors = []
          for raw in files.split(b"\0"):
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              if path.is_symlink():
                  continue  # icon symlinks are covered by the resource audit
              try:
                  if path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
                  elif path.suffix == ".svgz":
                      with gzip.open(path, "rb") as source:
                          ET.parse(source)
                  else:
                      ET.parse(path)
                  count += 1
              except (OSError, ValueError, ET.ParseError) as error:
                  errors.append(f"{path}: {error}")
          print(f"Parsed {count} files; {len(errors)} errors")
          for error in errors:
              print(error)
          if errors or not count:
              raise SystemExit(1)
          PY
      - name: Nix syntax only
        if: steps.deps.outcome == 'success' && !cancelled()
        run: |
          inventory="$(mktemp)"
          trap 'rm -f -- "$inventory"' EXIT
          git ls-files -z -- '*.nix' > "$inventory"
          mapfile -d '' -t expressions < "$inventory"
          [ "${#expressions[@]}" -gt 0 ]
          failed=0
          for file in "${expressions[@]}"; do
            echo "Parsing $file"
            nix-instantiate --parse "$file" >/dev/null || failed=1
          done
          echo "Checked ${#expressions[@]} Nix expressions"
          exit "$failed"
      - name: Parse all QML using Qt
        if: steps.deps.outcome == 'success' && !cancelled()
        run: bash scripts/check-qml-syntax.sh
      - name: QML lint diagnostics for Snap Layouts
        if: steps.deps.outcome == 'success' && !cancelled()
        run: |
          tool=/usr/lib64/qt6/bin/qmllint
          if [ ! -x "$tool" ]; then tool="$(command -v qmllint6 || command -v qmllint)"; fi
          # KWin's in-process module may not expose external type metadata.
          # Keep unresolved imports and other diagnostics visible; do not
          # disable warnings or claim full semantic coverage in that case.
          "$tool" --version
          log="$(mktemp)"
          trap 'rm -f -- "$log"' EXIT
          result=0
          "$tool" plasma/kwinscripts/org.kde.windowsmodern.snaplayouts/contents/ui/{main,CaptionSnapPicker,SnapBar}.qml 2>&1 | tee "$log" || result=$?
          if grep -q 'Failed to import org.kde.kwin' "$log"; then
            echo "::warning::KWin type metadata unavailable; QML semantic analysis is incomplete."
            echo 'QML semantic analysis is incomplete: org.kde.kwin type metadata is unavailable outside the KWin process.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q '^Warning:' "$log"; then
            echo "::warning::qmllint emitted warnings; review the diagnostics, even if its exit status is zero."
            echo 'qmllint emitted warnings; see the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Read-only resource reference audit
        if: steps.deps.outcome == 'success' && !cancelled()
        run: |
          python3 scripts/icon-coverage.py > /tmp/icon-coverage-source.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/icon-coverage-source.json", encoding="utf-8"))
          print("Reference counts:", json.dumps(report["counts"], sort_keys=True))
          print("Broken icon links:", report["broken_theme_links"])
          print("Missing icon directories:", report["missing_index_directories"])
          for key in ("not_in_theme", "bundled_not_native_verified",
                      "path_bypasses_theme", "native_mapping_not_verified"):
              rows = report["references"].get(key, [])
              print(f"{key}: {len(rows)}")
              for row in rows:
                  locations = ", ".join(f"{x['file']}:{x['line']}"
                                        for x in row.get("qml_candidates", [])[:3])
                  if locations:
                      print(f"  {row['name']}: {locations}")
          print("Source reference counts:", json.dumps(report["source_reference_counts"], sort_keys=True))
          for key in ("private_role_unmapped", "private_name_unmapped", "cpp_theme_name",
                      "dynamic_cpp_candidate", "direct_artwork"):
              for row in report["source_references"].get(key, []):
                  print(f"  {key}: {row['file']}:{row['line']} {row['value']}")
          print("Limitations:", report["limitations"])
          if report["broken_theme_links"] or report["missing_index_directories"]:
              raise SystemExit(1)
          PY

  konsole:
    name: Konsole 26.08.3 compiler syntax and type checks
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: dnf install -y --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and matching framework development headers
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            clang gcc-c++ cmake ninja-build extra-cmake-modules python3 \
            pkgconf-pkg-config gettext \
            qt6-qtbase-devel qt6-qtmultimedia-devel qt6-qtsvg-devel \
            kf6-kbookmarks-devel kf6-kconfig-devel kf6-kconfigwidgets-devel \
            kf6-kcoreaddons-devel kf6-kcrash-devel kf6-kguiaddons-devel \
            kf6-ki18n-devel kf6-kiconthemes-devel kf6-kio-devel \
            kf6-knewstuff-devel kf6-knotifications-devel kf6-knotifyconfig-devel \
            kf6-kparts-devel kf6-kservice-devel kf6-ktextwidgets-devel \
            kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel kf6-kxmlgui-devel \
            kf6-kpty-devel kf6-kdbusaddons-devel kf6-kglobalaccel-devel \
            libicu-devel libssh-devel libxkbcommon-devel
          clang++ --version
          rpm -q qt6-qtbase-devel kf6-kcoreaddons-devel
      - name: Obtain pinned upstream source and configure declarations
        run: |
          upstream=/tmp/wm-konsole-source
          build=/tmp/wm-konsole-static
          git clone --depth=1 --branch v26.08.3 https://github.com/KDE/konsole.git "$upstream"
          test "$(git -C "$upstream" rev-parse HEAD)" = 5665f691b34991adf3edb1ef503b8cf36bac834e
          cp -R app-decorations/konsole "$upstream/src/plugins/WindowsModernChrome"
          printf '\n%s\n' 'add_subdirectory(WindowsModernChrome)' >> "$upstream/src/plugins/CMakeLists.txt"
          # Configure only. CMake may compile small feature-detection probes;
          # no application or plugin objects, links, installs or tests.
          cmake -S "$upstream" -B "$build" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF \
            -DENABLE_PLUGIN_SSHMANAGER=OFF -DENABLE_PLUGIN_QUICKCOMMANDS=OFF
          /usr/libexec/kf6/kconfig_compiler_kf6 \
            "$upstream/src/settings/konsole.kcfg" \
            "$upstream/src/settings/KonsoleSettings.kcfgc" -d "$build/src"
          test -s "$build/src/KonsoleSettings.h"
          # Run Qt's declaration generator directly, not a build target.
          cmake -E cmake_autogen \
            "$build/src/plugins/WindowsModernChrome/CMakeFiles/konsole_windowsmodernchrome_autogen.dir/AutogenInfo.json" Release
      - name: Clang syntax-only with the real compile database
        run: |
          python3 - <<'PY'
          import json, pathlib, shlex, subprocess
          build = pathlib.Path("/tmp/wm-konsole-static")
          database = json.loads((build / "compile_commands.json").read_text())
          expected = {"windowsmodernchrome.cpp", "captionsnapbridge.cpp",
                      "chromeshadow.cpp", "mocs_compilation.cpp"}
          checked = set()
          failures = []
          for entry in database:
              if "WindowsModernChrome/" not in entry["file"]:
                  continue
              name = pathlib.Path(entry["file"]).name
              if name not in expected:
                  continue
              original = entry.get("arguments") or shlex.split(entry["command"])
              # CMake's compiler command, with only its object/dependency
              # output options removed. Never link or emit an object.
              args = [original[0], "-fsyntax-only"]
              index = 1
              while index < len(original):
                  arg = original[index]
                  if arg in ("-o", "-MF", "-MT", "-MQ"):
                      index += 2
                      continue
                  if arg not in ("-c", "-MD", "-MMD", "-MP"):
                      args.append(arg)
                  index += 1
              print(f"Checking {entry['file']}", flush=True)
              checked.add(name)
              result = subprocess.run(args, cwd=entry["directory"], check=False)
              if result.returncode:
                  failures.append(name)
          print("Checked:", sorted(checked))
          print("Failed:", failures)
          if checked != expected or failures:
              raise SystemExit(1)
          PY
